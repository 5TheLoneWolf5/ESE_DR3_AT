services:

  # --- Service Discovery ---
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservicos-net

  # --- Configurações centralizadas ---
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"

    volumes:
      - ./config-repo:/config-repo

    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:///config-repo

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - microservicos-net


  # --- Serviço de produtos ---
  produtos-service:
    build: ./produtos-service
    container_name: produtos-service

    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy

    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

    ports:
      - "8081:8081"

    networks:
      - microservicos-net


  # --- Serviço de vendas ---
  vendas-service:
    build: ./vendas-service
    container_name: vendas-service

    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy

    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

    ports:
      - "8082:8082"

    networks:
      - microservicos-net


  # --- Serviço de clientes ---
  clientes-service:
    build: ./clientes-service
    container_name: clientes-service

    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy

    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

    ports:
      - "8083:8083"

    networks:
      - microservicos-net


  # --- Serviço de fornecedores ---
  fornecedores-service:
    build: ./fornecedores-service
    container_name: fornecedores-service

    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy

    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

    ports:
      - "8084:8084"

    networks:
      - microservicos-net


  # --- Serviço de autenticação ---
  auth-service:
    build: ./auth-service
    container_name: auth-service

    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy

    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

    ports:
      - "8086:8086"

    networks:
      - microservicos-net


  # --- API Gateway ---
  gateway:
    build: ./gateway
    container_name: gateway

    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy

    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

    ports:
      - "8085:8085"

    networks:
      - microservicos-net


# --- Rede ---
networks:
  microservicos-net:
    driver: bridge